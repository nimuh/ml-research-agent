[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-research-agent"
version = "0.1.0"
description = "Agentic system that researches an ML idea: literature search, knowledge base, and a team of agents that design and run experiments to test it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nima" }]

# Kept deliberately small at the planning stage; each layer's real deps are
# listed in docs/PLAN.md and get added as that layer is implemented.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "httpx>=0.27",
    "anthropic>=0.40",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
literature = ["arxiv>=2.1", "pymupdf>=1.24", "beautifulsoup4>=4.12"]
# No LanceDB: the vector index is a numpy matrix under paths.kb_index, which is
# rebuildable from the files that are truth (see knowledge/index.py).
knowledge = ["numpy>=1.26", "rank-bm25>=0.2.2", "networkx>=3.3"]
experiments = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13", "matplotlib>=3.9"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
all = ["ml-research-agent[literature,knowledge,experiments,dev]"]

[project.scripts]
mra = "ml_research_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_research_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# 3.12, not 3.11: numpy's bundled stubs use `type` statements that mypy rejects
# under an older target. Our own code stays 3.11-compatible (ruff enforces py311).
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["src/ml_research_agent"]

# PyYAML ships no type stubs and types-PyYAML is not a runtime dependency.
# Narrowly scoped: only the missing-stub import is ignored, not our own code.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# rank_bm25 and networkx ship no stubs; numpy's own stubs are used as-is.
[[tool.mypy.overrides]]
module = ["rank_bm25.*", "networkx.*"]
ignore_missing_imports = true

# scipy is an optional extra used only for the t-distribution tail; metrics.py
# falls back to a stdlib implementation when it is absent.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: exercises several layers together; slower, still offline",
    "adversarial: a deliberately defective artifact the system must catch",
]
# src-layout import without depending on the editable install being healthy.
pythonpath = ["src"]
