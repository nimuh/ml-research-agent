# Default configuration. Override with configs/local.yaml, MRA_* env vars, or CLI flags.
# Precedence: CLI flag > env > configs/local.yaml > this file.

paths:
  workspace: ./workspace
  kb_raw: ./workspace/kb/raw          # unprocessed PDFs, HTML, repo snapshots
  kb_wiki: ./workspace/kb/wiki        # compiled notes and concept pages
  kb_reports: ./workspace/kb/reports  # generated reports
  runs: ./workspace/runs              # per-experiment workspaces + run records
  repos: ./workspace/repos            # content-addressed repo cache
  cache: ./workspace/cache            # HTTP / LLM / embedding caches

llm:
  provider: anthropic
  tiers:
    fast: claude-haiku-4-5-20251001   # extraction, screening, classification
    standard: claude-sonnet-5         # note writing, code analysis, implementation
    deep: claude-opus-5               # framing, experiment design, critique
  max_concurrency: 8
  cache_responses: true

budget:
  usd_per_project: 50.0
  tokens_per_phase: 2_000_000
  max_wallclock_hours: 12
  # Hard stop, not advisory: exceeding a ceiling raises BudgetExceeded.

literature:
  sources: [arxiv, semantic_scholar, openreview, paperswithcode, github, web]
  max_candidates: 300        # retrieved before screening
  max_kb_papers: 60          # survive screening into the KB
  snowball_depth: 2
  snowball_min_score: 0.55
  date_window_years: 6       # soft prior; seminal work is exempt via citation count

knowledge:
  embedding_model: text-embedding-3-large  # part of the embedding cache key; only an API backend consults it
  chunk_tokens: 800
  chunk_overlap: 120
  retrieval:
    top_k: 20
    rerank_top_n: 8
    hybrid_alpha: 0.5        # vector vs BM25 weight
  require_citations: true    # notes with unsupported claims are rejected

code:
  max_repos_per_paper: 2
  clone_depth: 1
  allowed_licenses: [MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, MPL-2.0]
  run_untrusted_code: false  # repo code only ever executes inside the sandbox

experiments:
  default_seeds: 3
  max_parallel_runs: 2
  max_runtime_minutes: 120
  require_preregistered_decision_rule: true
  scale_ladder: [smoke, small, main]   # never launch `main` before `smoke` passes

sandbox:
  backend: subprocess        # subprocess | docker | remote
  network: deny              # allow-list only for dataset/model downloads
  filesystem_scope: workspace
  gpu: auto

gates:
  after_survey: true         # human reviews the KB + framing before design
  before_run: true           # human approves specs and cost before compute burns
  before_report: false

observability:
  log_level: INFO
  trace: true
  cost_ledger: true          # false keeps in-memory accounting, stops writing cost.jsonl
